<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ranking de Vendas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
}

header p {
    margin: 8px 0 0;
}

.status {
    text-align: center;
    padding: 10px;
    font-weight: bold;
}

/* RESUMO */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.resumo {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.resumo-card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 3px 10px #0002;
}

.resumo-card h3 {
    margin: 0 0 10px;
}

.resumo-numero {
    font-size: 32px;
    font-weight: bold;
}

/* RANKING */

.ranking {
    background: white;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 35px;
    box-shadow: 0 3px 10px #0002;
}

.ranking-item {
    display: flex;
    align-items: center;
    padding: 13px 10px;
    border-bottom: 1px solid #eee;
}

.ranking-item:last-child {
    border-bottom: none;
}

.posicao {
    width: 60px;
    font-size: 22px;
    font-weight: bold;
}

.ranking-nome {
    flex: 1;
    font-size: 18px;
    font-weight: bold;
}

.ranking-vendas {
    font-weight: bold;
    font-size: 18px;
}

/* VENDEDORES */

.equipe {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

/*
   IMPORTANTE:
   Os vendedores são criados uma única vez
   e nunca são reordenados.
*/

.vendedor {
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 3px 10px #0002;
}

.nome {
    font-size: 21px;
    font-weight: bold;
    min-height: 25px;
}

.contador {
    font-size: 55px;
    font-weight: bold;
    margin: 15px;
}

.botoes {
    display: flex;
    justify-content: center;
    gap: 10px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 15px 25px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.95);
}

.menos {
    background: #e53935;
    color: white;
}

.mais {
    background: #16a34a;
    color: white;
}

/* MOBILE */

@media(max-width: 800px) {

    .equipe {
        grid-template-columns: repeat(2, 1fr);
    }

    .resumo {
        grid-template-columns: 1fr;
    }

}

@media(max-width: 450px) {

    .container {
        padding: 10px;
    }

    .equipe {
        gap: 10px;
    }

    .vendedor {
        padding: 15px 5px;
    }

    .nome {
        font-size: 17px;
    }

    .contador {
        font-size: 40px;
    }

    button {
        padding: 12px 15px;
        font-size: 18px;
    }

}

</style>
</head>

<body>

<header>

    <h1>🏆 RANKING DE VENDAS</h1>

    <p>
        Atualização em tempo real
    </p>

</header>

<div class="status" id="status">
    🔄 Conectando...
</div>


<div class="container">

    <!-- RESUMO -->

    <div class="resumo">

        <div class="resumo-card">

            <h3>
                📦 TOTAL DE VENDAS
            </h3>

            <div
                class="resumo-numero"
                id="total">
                0
            </div>

        </div>


        <div class="resumo-card">

            <h3>
                🥇 LÍDER
            </h3>

            <div
                class="resumo-numero"
                id="lider">
                -
            </div>

        </div>


        <div class="resumo-card">

            <h3>
                🏆 VENDAS DO LÍDER
            </h3>

            <div
                class="resumo-numero"
                id="vendasLider">
                0
            </div>

        </div>

    </div>


    <!-- RANKING -->

    <h2>
        🏆 Ranking
    </h2>

    <div
        class="ranking"
        id="ranking">
    </div>


    <!-- VENDEDORES -->

    <h2>
        👥 Vendedores
    </h2>

    <div
        class="equipe"
        id="equipe">
    </div>

</div>


<script>

/* ==========================================
   CONFIGURAÇÃO SUPABASE
========================================== */

const SUPABASE_URL =
"https://qjheutgzirjlykoyjadz.supabase.co";

const SUPABASE_KEY =
"sb_publishable__FyKOqu1wA6zXvBfGkwX3A_bn2EEY67";


const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   LISTA FIXA DOS VENDEDORES
========================================== */

const nomes = [

    "Hugo",
    "Jeronimo",
    "Leo",
    "André",
    "Felipe",
    "Gilvan",
    "Taciana",
    "Joyce",
    "Karlone",
    "Fernanda",
    "Fagna",
    "Taisa",
    "Francielly",
    "Rozivan",
    "Wagner",
    "Dani"

];


let vendedores = [];


/* ==========================================
   CRIAR OS CARTÕES
   A ORDEM É FIXA
========================================== */

function criarCartoes() {

    const equipe =
        document.getElementById("equipe");

    equipe.innerHTML = "";


    nomes.forEach(nome => {

        equipe.innerHTML += `

            <div
                class="vendedor"
                id="card-${nome}">

                <div class="nome">
                    ${nome}
                </div>

                <div
                    class="contador"
                    id="contador-${nome}">
                    0
                </div>

                <div class="botoes">

                    <button
                        class="menos"
                        onclick="alterar('${nome}', -1)">
                        −1
                    </button>

                    <button
                        class="mais"
                        onclick="alterar('${nome}', 1)">
                        +1
                    </button>

                </div>

            </div>

        `;

    });

}


/* ==========================================
   CARREGAR DADOS
========================================== */

async function carregar() {

    const { data, error } = await db
        .from("vendedores")
        .select("*");


    if (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "🔴 Erro ao conectar ao banco";

        return;

    }


    vendedores = data || [];


    atualizarContadores();

    atualizarRanking();


    document.getElementById("status").textContent =
        "🟢 Conectado — atualização em tempo real";

}


/* ==========================================
   ATUALIZAR OS CONTADORES
   SEM ALTERAR A POSIÇÃO DOS CARTÕES
========================================== */

function atualizarContadores() {

    vendedores.forEach(vendedor => {

        const elemento =
            document.getElementById(
                "contador-" + vendedor.nome
            );


        if (elemento) {

            elemento.textContent =
                vendedor.vendas;

        }

    });

}


/* ==========================================
   ATUALIZAR RANKING
   SOMENTE O RANKING MUDA DE POSIÇÃO
========================================== */

function atualizarRanking() {

    const ranking =
        document.getElementById("ranking");


    /*
       Cria uma cópia para ordenar.
       A lista original NÃO é alterada.
    */

    const listaRanking =
        [...vendedores].sort(
            (a, b) => b.vendas - a.vendas
        );


    ranking.innerHTML = "";


    listaRanking.forEach((vendedor, index) => {

        let medalha;


        if (index === 0) {

            medalha = "🥇";

        } else if (index === 1) {

            medalha = "🥈";

        } else if (index === 2) {

            medalha = "🥉";

        } else {

            medalha =
                (index + 1) + "º";

        }


        ranking.innerHTML += `

            <div class="ranking-item">

                <div class="posicao">
                    ${medalha}
                </div>

                <div class="ranking-nome">
                    ${vendedor.nome}
                </div>

                <div class="ranking-vendas">
                    ${vendedor.vendas} vendas
                </div>

            </div>

        `;

    });


    /* TOTAL */

    let total = 0;


    vendedores.forEach(vendedor => {

        total +=
            Number(vendedor.vendas || 0);

    });


    document.getElementById("total")
        .textContent = total;


    /* LÍDER */

    if (listaRanking.length > 0) {

        document.getElementById("lider")
            .textContent =
            listaRanking[0].nome;


        document.getElementById("vendasLider")
            .textContent =
            listaRanking[0].vendas;

    }

}


/* ==========================================
   ALTERAR VENDA
========================================== */

async function alterar(nome, valor) {

    const vendedor = vendedores.find(
        v => v.nome === nome
    );

    if (!vendedor) {
        alert("Vendedor não encontrado.");
        return;
    }

    // Desabilita os botões desse vendedor
    // enquanto a operação está sendo enviada
    const botoes = document.querySelectorAll(
        `button[onclick*="'${nome}'"]`
    );

    botoes.forEach(botao => {
        botao.disabled = true;
    });

    try {

        const { data, error } = await db.rpc(
            "alterar_vendas",
            {
                vendedor_id: vendedor.id,
                quantidade: valor
            }
        );

        if (error) {
            console.error(error);
            alert("Erro ao registrar a venda.");
            return;
        }

        // Atualiza o valor local imediatamente
        vendedor.vendas = Number(data);

        atualizarContadores();
        atualizarRanking();

    } catch (erro) {

        console.error(erro);

        alert("Erro ao registrar a alteração.");

    } finally {

        // Libera os botões novamente
        botoes.forEach(botao => {
            botao.disabled = false;
        });

    }
}


/* ==========================================
   ATUALIZAÇÃO EM TEMPO REAL
========================================== */

db.channel("ranking-vendas")

    .on(

        "postgres_changes",

        {
            event: "*",
            schema: "public",
            table: "vendedores"
        },

        function(payload) {

            carregar();

        }

    )

    .subscribe();


/* ==========================================
   INICIAR
========================================== */

criarCartoes();

carregar();

</script>

</body>
</html>
